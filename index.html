<script>
// ============================================================
// INLINED BUNDLE — With Backend Connectivity & API Synchronization
// ============================================================
const API_BASE = "http://127.0.0.1:8000/api";
let backendActive = false;

async function checkBackend() {
  try {
    const res = await fetch("http://127.0.0.1:8000/", { method: "GET" });
    if (res.ok) {
      backendActive = true;
      console.log("Connected to Abhishek Book Depot Backend Server! 🎉");
    }
  } catch (e) {
    backendActive = false;
    console.warn("FastAPI backend offline. Falling back to local storage mode.");
  }
}

async function apiRequest(endpoint, method = "GET", body = null) {
  if (!backendActive) return null;
  const token = localStorage.getItem("abd_token");
  const headers = { "Content-Type": "application/json" };
  if (token) { headers["Authorization"] = `Bearer ${token}`; }
  try {
    const options = { method, headers };
    if (body) { options.body = JSON.stringify(body); }
    const res = await fetch(`${API_BASE}${endpoint}`, options);
    if (!res.ok) {
      const errorData = await res.json();
      throw new Error(errorData.detail || "Request failed");
    }
    return await res.json();
  } catch (e) {
    console.error(`API Error on ${endpoint}:`, e);
    throw e;
  }
}

async function syncLocalDataToBackend() {
  if (!backendActive) return;
  try {
    const cartItems = CartState.get().items;
    if (cartItems.length > 0) { await apiRequest("/cart", "POST", cartItems); }
    const wishItems = WishlistState.get().items;
    if (wishItems.length > 0) { await apiRequest("/wishlist", "POST", wishItems); }
  } catch (e) {
    console.error("Error syncing local data to backend:", e);
  }
}

async function pullUserDataFromBackend() {
  if (!backendActive) return;
  try {
    const cartData = await apiRequest("/cart");
    if (cartData && cartData.items) {
      CartState.set({ items: cartData.items });
      Storage.set('abd_cart', cartData.items);
    }
    const wishData = await apiRequest("/wishlist");
    if (wishData) {
      WishlistState.set({ items: wishData });
      Storage.set('abd_wishlist', wishData);
    }
  } catch (e) {
    console.error("Error pulling data from backend:", e);
  }
}

async function loadProducts() {
  if (backendActive) {
    try {
      const res = await fetch("http://127.0.0.1:8000/api/products");
      if (res.ok) {
        const db_products = await res.json();
        window.PRODUCTS = db_products;
        console.log(`Loaded ${db_products.length} products from backend database. 📚`);
        return;
      }
    } catch (e) {
      console.error("Failed to load products from database, using static fallback.");
    }
  }
  const customEdits = Storage.get('abd_custom_products', {});
  if (customEdits && Object.keys(customEdits).length > 0) {
    PRODUCTS.forEach((p, idx) => {
      if (customEdits[p.id]) {
        PRODUCTS[idx] = { ...p, ...customEdits[p.id] };
      }
    });
  }
  window.PRODUCTS = PRODUCTS;
}

// ── Storage Helpers ──────────────────────────────────────────
const Storage = {
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  remove:(k)=>{try{localStorage.removeItem(k);}catch{}}
};

// ── Reactive State ────────────────────────────────────────────
class State {
  constructor(init){this._s={...init};this._l=new Set();}
  get(){return{...this._s};}
  set(patch){this._s={...this._s,...(typeof patch==='function'?patch(this._s):patch)};this._l.forEach(fn=>fn(this._s));}
  subscribe(fn){this._l.add(fn);return()=>this._l.delete(fn);}
}

const AuthState    = new State({user:Storage.get('abd_user',null),isLoggedIn:!!Storage.get('abd_user',null),isGuest:Storage.get('abd_guest',false)});
const CartState    = new State({items:Storage.get('abd_cart',[])});
const WishlistState= new State({items:Storage.get('abd_wishlist',[])});
const ThemeState   = new State({dark:Storage.get('abd_dark',false)});const saveCart = () => {
  Storage.set('abd_cart', CartState.get().items);
  if (backendActive && AuthState.get().isLoggedIn) {
    apiRequest("/cart", "POST", CartState.get().items).catch(e => console.error("Cart sync error", e));
  }
};
const saveWishlist = () => {
  Storage.set('abd_wishlist', WishlistState.get().items);
  if (backendActive && AuthState.get().isLoggedIn) {
    apiRequest("/wishlist", "POST", WishlistState.get().items).catch(e => console.error("Wishlist sync error", e));
  }
};
// ── Auth ──────────────────────────────────────────────────────
const Auth = {
  async register(data){
    if (backendActive) {
      try {
        const res = await apiRequest("/auth/register", "POST", data);
        if (res && res.access_token) {
          localStorage.setItem("abd_token", res.access_token);
          Storage.set("abd_user", res.user);
          AuthState.set({ user: res.user, isLoggedIn: true, isGuest: false });
          await syncLocalDataToBackend();
          return { ok: true };
        }
      } catch (err) {
        return { ok: false, error: err.message };
      }
    }
    const users=Storage.get('abd_users',[]);
    if(users.find(u=>u.email===data.email))return{ok:false,error:'Email already registered'};
    const user={id:Date.now(),...data,createdAt:new Date().toISOString(),orders:[]};
    users.push(user);Storage.set('abd_users',users);Storage.set('abd_user',user);Storage.remove('abd_guest');
    AuthState.set({user,isLoggedIn:true,isGuest:false});return{ok:true};
  },
  async login(email,password){
    if (backendActive) {
      try {
        const res = await apiRequest("/auth/login", "POST", { email, password });
        if (res && res.access_token) {
          localStorage.setItem("abd_token", res.access_token);
          Storage.set("abd_user", res.user);
          AuthState.set({ user: res.user, isLoggedIn: true, isGuest: false });
          await pullUserDataFromBackend();
          return { ok: true };
        }
      } catch (err) {
        return { ok: false, error: err.message };
      }
    }
    const users=Storage.get('abd_users',[]);
    const user=users.find(u=>u.email===email&&u.password===password);
    if(!user)return{ok:false,error:'Invalid email or password'};
    Storage.set('abd_user',user);AuthState.set({user,isLoggedIn:true,isGuest:false});return{ok:true};
  },
  logout(){
    if (backendActive) {
      localStorage.removeItem("abd_token");
    }
    Storage.remove('abd_user');AuthState.set({user:null,isLoggedIn:false,isGuest:false});
    CartState.set({items:[]});saveCart();
    WishlistState.set({items:[]});saveWishlist();
  },
  continueAsGuest(){Storage.set('abd_guest',true);AuthState.set({user:null,isLoggedIn:false,isGuest:true});}
};

// ── Admin State Helpers & PIN Lock ──────────────────────────
function isAdminUser(){
  const u=AuthState.get().user;
  const mode=Storage.get('abd_admin_mode',false);
  return (u && u.role === 'admin') || mode === true;
}

function promptAdminPin(onSuccess = null) {
  if (isAdminUser()) {
    if (onSuccess) onSuccess();
    return;
  }

  let modal = document.getElementById('admin-pin-modal');
  if (modal) modal.remove();

  modal = document.createElement('div');
  modal.id = 'admin-pin-modal';
  modal.className = 'modal-overlay';
  modal.style.display = 'flex';
  modal.innerHTML = `
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <h3>🔐 Admin Security Verification</h3>
        <span class="modal-close" onclick="document.getElementById('admin-pin-modal').remove()">×</span>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">Enter Security PIN or Password to access Admin Panel & Store Editing.</p>
        <div id="pin-error" style="display:none;background:#FEE2E2;color:#B91C1C;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px"></div>
        <div class="form-group">
          <label class="form-label">Security PIN / Password</label>
          <div class="form-input-wrap">
            <span class="input-icon">🔑</span>
            <input type="password" class="form-input" id="admin-pin-input" placeholder="Enter PIN (Default: 1234)" onkeydown="if(event.key==='Enter')verifyAdminPin()" autofocus />
          </div>
          <p style="font-size:11px;color:var(--text-muted);margin-top:6px">Default owner PIN: <strong>1234</strong> (or password <strong>admin123</strong>)</p>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-primary btn-full" onclick="verifyAdminPin()">Unlock Admin Mode</button>
          <button class="btn btn-ghost" onclick="document.getElementById('admin-pin-modal').remove()">Cancel</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  setTimeout(() => document.getElementById('admin-pin-input')?.focus(), 100);

  window._adminPinCallback = onSuccess;
}

function verifyAdminPin() {
  const pin = document.getElementById('admin-pin-input')?.value?.trim();
  const err = document.getElementById('pin-error');
  const storedPin = Storage.get('abd_admin_pin', '1234');
  
  if (pin === storedPin || pin === 'admin123') {
    Storage.set('abd_admin_mode', true);
    Toast.show('👑 Admin Mode Unlocked! Welcome, Shop Owner.', 'success');
    const modal = document.getElementById('admin-pin-modal');
    if (modal) modal.remove();
    const cb = window._adminPinCallback;
    window._adminPinCallback = null;
    if (cb) {
      cb();
    } else {
      routeRender(location.hash || '#/');
    }
  } else {
    if (err) {
      err.textContent = '❌ Incorrect PIN or Password.';
      err.style.display = 'block';
    }
  }
}

function openChangeAdminPinModal() {
  if (!isAdminUser()) {
    promptAdminPin(() => openChangeAdminPinModal());
    return;
  }
  let modal = document.getElementById('change-pin-modal');
  if (modal) modal.remove();

  modal = document.createElement('div');
  modal.id = 'change-pin-modal';
  modal.className = 'modal-overlay';
  modal.style.display = 'flex';
  modal.innerHTML = `
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <h3>🔑 Change Admin Security PIN</h3>
        <span class="modal-close" onclick="document.getElementById('change-pin-modal').remove()">×</span>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">Set a new secret PIN or Password to protect your store admin panel.</p>
        <div id="cpin-error" style="display:none;background:#FEE2E2;color:#B91C1C;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px"></div>
        
        <div class="form-group">
          <label class="form-label">Current PIN / Password</label>
          <input type="password" class="form-input" id="cpin-old" placeholder="Enter current PIN (Default: 1234)" />
        </div>
        <div class="form-group">
          <label class="form-label">New PIN / Password *</label>
          <input type="password" class="form-input" id="cpin-new" placeholder="Min. 4 characters / digits" />
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New PIN *</label>
          <input type="password" class="form-input" id="cpin-confirm" placeholder="Repeat new PIN" />
        </div>
        
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-primary btn-full" onclick="saveNewAdminPin()">💾 Update PIN</button>
          <button class="btn btn-ghost" onclick="document.getElementById('change-pin-modal').remove()">Cancel</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function saveNewAdminPin() {
  const oldPin = document.getElementById('cpin-old')?.value?.trim();
  const newPin = document.getElementById('cpin-new')?.value?.trim();
  const confirmPin = document.getElementById('cpin-confirm')?.value?.trim();
  const err = document.getElementById('cpin-error');
  const storedPin = Storage.get('abd_admin_pin', '1234');

  if (oldPin !== storedPin && oldPin !== 'admin123') {
    if (err) { err.textContent = '❌ Current PIN is incorrect.'; err.style.display = 'block'; }
    return;
  }
  if (!newPin || newPin.length < 4) {
    if (err) { err.textContent = '❌ New PIN must be at least 4 characters or digits.'; err.style.display = 'block'; }
    return;
  }
  if (newPin !== confirmPin) {
    if (err) { err.textContent = '❌ New PINs do not match.'; err.style.display = 'block'; }
    return;
  }

  Storage.set('abd_admin_pin', newPin);
  Toast.show('🔑 Admin PIN updated successfully! 🎉', 'success');
  const modal = document.getElementById('change-pin-modal');
  if (modal) modal.remove();
}

function toggleAdminMode() {
  const current = Storage.get('abd_admin_mode', false);
  if (current || (AuthState.get().user && AuthState.get().user.role === 'admin')) {
    Storage.set('abd_admin_mode', false);
    Toast.show('👤 Switched to Customer View', 'info');
    routeRender(location.hash || '#/');
  } else {
    promptAdminPin(() => routeRender(location.hash || '#/'));
  }
}


// ── Cart ──────────────────────────────────────────────────────
const Cart = {
  getCount:()=>CartState.get().items.reduce((s,i)=>s+i.qty,0),
  getTotal:()=>CartState.get().items.reduce((s,i)=>s+i.price*i.qty,0),
  getMrpTotal:()=>CartState.get().items.reduce((s,i)=>s+i.mrp*i.qty,0),
  has:(id)=>CartState.get().items.some(i=>i.id===id),
  add(product,qty=1){
    CartState.set(s=>{
      const items=[...s.items],idx=items.findIndex(i=>i.id===product.id);
      if(idx>=0)items[idx]={...items[idx],qty:Math.min(items[idx].qty+qty,10)};
      else items.push({...product,qty});return{items};
    });saveCart();Toast.show('Added to cart! 🛒','success');
  },
  remove(id){CartState.set(s=>({items:s.items.filter(i=>i.id!==id)}));saveCart();Toast.show('Removed from cart','info');},
  updateQty(id,qty){if(qty<1)return Cart.remove(id);CartState.set(s=>({items:s.items.map(i=>i.id===id?{...i,qty:Math.min(qty,10)}:i)}));saveCart();},
  clear(){CartState.set({items:[]});saveCart();},
  applyCoupon(code){
    const c=code.toUpperCase();
    const total=Cart.getTotal();
    const map={BACK2SCHOOL:{type:'percent',rate:20},BOOKFAIR25:{type:'percent',rate:25},FLAT50:{type:'flat',amount:50},FIRSTBUY:{type:'percent',rate:15},GIFT10:{type:'percent',rate:10}};
    if(map[c]){
      const o=map[c];
      const disc=o.type==='percent'?Math.round(total*o.rate/100):o.amount;
      return{ok:true,discount:disc,code:c,type:o.type,rate:o.rate||null};
    }
    return{ok:false,error:'Invalid or expired coupon code'};
  }
};

// ── Wishlist ──────────────────────────────────────────────────
const Wishlist = {
  has:(id)=>WishlistState.get().items.some(i=>i.id===id),
  getCount:()=>WishlistState.get().items.length,
  toggle(product){
    if(Wishlist.has(product.id)){
      WishlistState.set(s=>({items:s.items.filter(i=>i.id!==product.id)}));saveWishlist();Toast.show('Removed from wishlist','info');
    }else{
      WishlistState.set(s=>({items:[...s.items,product]}));saveWishlist();Toast.show('Added to wishlist! ❤️','success');
    }
  }
};

// ── Theme ─────────────────────────────────────────────────────
const Theme = {

// ── Orders ────────────────────────────────────────────────────

// ── RecentlyViewed ────────────────────────────────────────────
const RecentlyViewed = {
  add(p){let items=Storage.get('abd_recent',[]);items=[p,...items.filter(i=>i.id!==p.id)].slice(0,8);Storage.set('abd_recent',items);},
  get:()=>Storage.get('abd_recent',[])
};

// ── Toast ─────────────────────────────────────────────────────
const Toast = {
  show(msg,type='info'){
    const c=document.getElementById('toast-container');if(!c)return;
    const t=document.createElement('div');t.className=`toast ${type}`;
    const icons={success:'✅',error:'❌',info:'💬',warning:'⚠️'};
    t.innerHTML=`<span class="toast-icon">${icons[type]||'💬'}</span><span class="toast-msg">${msg}</span>`;
    c.appendChild(t);setTimeout(()=>{t.style.animation='slideInRight 0.3s ease reverse';setTimeout(()=>t.remove(),300);},3000);
  }
};

// ── Format Utilities ──────────────────────────────────────────
const fmt = {
  price:(n)=>`₹${Number(n).toLocaleString('en-IN')}`,
  number:(n)=>Number(n).toLocaleString('en-IN'),
  date:(iso)=>new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),
  stars(rating){
    const full=Math.floor(rating);const half=rating%1>=0.5;let h='';
    for(let i=0;i<5;i++){if(i<full)h+='<span class="star filled">★</span>';else if(i===full&&half)h+='<span class="star half">★</span>';else h+='<span class="star">★</span>';}
    return`<span class="stars">${h}</span>`;
  }
};

// ── Debounce ──────────────────────────────────────────────────
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

// ── Search ────────────────────────────────────────────────────
const Search = {
  query(q, products) {
    if (!q || !q.trim()) return products;
    const term = q.trim().toLowerCase();
    return products.filter(p => 
      (p.name && p.name.toLowerCase().includes(term)) ||
      (p.category && p.category.toLowerCase().includes(term)) ||
      (p.brand && p.brand.toLowerCase().includes(term)) ||
      (p.description && p.description.toLowerCase().includes(term)) ||
      (p.tags && Array.isArray(p.tags) && p.tags.some(t => t.toLowerCase().includes(term)))
    );
  }
};

// ── Simple Hash Router ────────────────────────────────────────
const Router = {
  _routes:{},
  register(routes){this._routes=routes;},
  navigate(hash,replace=false){
    if(replace)history.replaceState(null,'',hash);else history.pushState(null,'',hash);
    this._render(hash);
  },
  init(){window.addEventListener('popstate',()=>this._render(location.hash||'#/'));this._render(location.hash||'#/');},
  _render(hash){
    const route=hash.split('?')[0];
    let matched=null,params={};
    for(const[pattern,handler]of Object.entries(this._routes)){
      const p=pattern.replace(/:([^\/]+)/g,'([^/]+)');
      const keys=[...pattern.matchAll(/:([^\/]+)/g)].map(m=>m[1]);
      const m=route.match(new RegExp(`^${p}$`));
      if(m){matched=handler;keys.forEach((k,i)=>{params[k]=m[i+1];});break;}
    }
    if(matched){matched({params,hash});window.scrollTo(0,0);}
    else{Router.navigate('#/');}
  }
};

// Expose globals
window.Router=Router;window.Toast=Toast;window.Auth=Auth;window.Cart=Cart;window.Wishlist=Wishlist;window.fmt=fmt;

function renderStars(rating){
  const full=Math.floor(rating);const half=rating%1>=0.5;let h='';
  for(let i=0;i<5;i++){if(i<full)h+='<span class="star filled">★</span>';else if(i===full&&half)h+='<span class="star half">★</span>';else h+='<span class="star">★</span>';}
  return`<span class="stars">${h}</span>`;
}

function renderProductCard(p){
  const inWish=Wishlist.has(p.id),inCart=Cart.has(p.id);
  const stock=p.stock<5&&p.stock>0?`<span class="product-stock-low">Only ${p.stock} left!</span>`:p.stock===0?`<span class="product-stock-out">Out of Stock</span>`:'';
  const adminOverlay = isAdminUser() ? `<div class="product-admin-overlay">
    <button class="product-admin-btn" onclick="event.stopPropagation();openEditProductModal(${p.id})">✏️ Edit</button>
    <button class="product-admin-btn" onclick="event.stopPropagation();openEditProductModal(${p.id},'image')">🖼️ Image</button>
    <button class="product-admin-btn del" onclick="event.stopPropagation();delProduct(${p.id})">🗑️</button>
  </div>` : '';
  return`<div class="product-card" onclick="navigate('#/product/${p.id}')">
    <div class="product-img-wrap">
      ${adminOverlay}
      <span class="product-discount-badge">-${p.discount}%</span>
      <img class="product-img" src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://picsum.photos/seed/default${p.id}/400/400'" />
      <button class="product-wishlist-btn${inWish?' active':''}" id="wish-btn-${p.id}" onclick="event.stopPropagation();doToggleWishlist(${p.id})">${inWish?'❤️':'🤍'}</button>
      <div class="product-quick-view">👁 Quick View</div>
    </div>
    <div class="product-info">
      <div class="product-brand">${p.brand}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-rating">${renderStars(p.rating)}<span class="rating-count">(${fmt.number(p.reviews)})</span></div>
      <div class="product-price-row"><span class="price-current">${fmt.price(p.price)}</span><span class="price-mrp">${fmt.price(p.mrp)}</span><span class="price-off">${p.discount}% off</span></div>
      ${stock}
      <div class="product-actions">
        <button class="btn-add-cart${inCart?' added':''}" id="cart-btn-${p.id}" onclick="event.stopPropagation();doAddToCart(${p.id})"${p.stock===0?' disabled':''}>${inCart?'✓ Added':'🛒 Add to Cart'}</button>
      </div>
    </div>
  </div>`;
}

// -- PRODUCTS --
let productFilters={category:'all',sort:'default',search:'',maxPrice:2500,rating:0,page:1};
let currentView='grid';
let appliedCoupon=null;

function renderProducts(){
  const {category,sort,search,maxPrice,rating,page}=productFilters;
  const PER_PAGE=20;
  let products=[...PRODUCTS];
  if(category&&category!=='all')products=products.filter(p=>p.category===category);
  if(search)products=Search.query(search,products);
  if(maxPrice<2500)products=products.filter(p=>p.price<=maxPrice);
  if(rating>0)products=products.filter(p=>p.rating>=rating);
  if(sort==='price_asc')products.sort((a,b)=>a.price-b.price);
  if(sort==='price_desc')products.sort((a,b)=>b.price-a.price);
  if(sort==='rating')products.sort((a,b)=>b.rating-a.rating);
  if(sort==='discount')products.sort((a,b)=>b.discount-a.discount);
  if(sort==='new')products=products.slice().reverse();
  const total=products.length;
  const pages=Math.ceil(total/PER_PAGE);
  const paginated=products.slice((page-1)*PER_PAGE,page*PER_PAGE);
  const catLabel=category&&category!=='all'?CATEGORIES.find(c=>c.id===category)?.name||category:'All Products';
  const pagination=pages>1?`<div style="display:flex;justify-content:center;gap:8px;margin-top:32px;flex-wrap:wrap">${Array.from({length:pages},(_,i)=>`<button class="btn ${i+1===page?'btn-primary':'btn-outline'} btn-sm" onclick="goToPage(${i+1})">${i+1}</button>`).join('')}</div>`:'';
  return`<div class="container"><div class="products-page">
    <aside class="filter-sidebar">
      <h3>🔧 Filters <button class="filter-clear" onclick="clearFilters()">Clear All</button></h3>
      <div class="filter-group"><h4>Category</h4>${CATEGORIES.map(c=>`<div class="filter-option"><input type="checkbox" id="cat-${c.id}"${category===c.id?' checked':''} onchange="filterByCategory('${c.id}',this.checked)"/><label for="cat-${c.id}">${c.icon} ${c.name}</label></div>`).join('')}</div>
      <div class="filter-group"><h4>Price Range</h4><div class="price-range"><input type="range" min="0" max="2500" value="${maxPrice}" step="50" oninput="updatePriceFilter(this.value)"/><div class="price-labels"><span>₹0</span><span id="price-label">₹${maxPrice}</span></div></div></div>
      <div class="filter-group"><h4>Minimum Rating</h4>${[4.5,4.0,3.5].map(r=>`<div class="filter-option"><input type="radio" name="rating" value="${r}"${rating===r?' checked':''} onchange="filterByRating(${r})"/><label>${renderStars(r)} & above</label></div>`).join('')}<div class="filter-option"><input type="radio" name="rating" value="0"${!rating?' checked':''} onchange="filterByRating(0)"/><label>All Ratings</label></div></div>
    </aside>
    <main class="products-main">
      <div class="products-toolbar">
        <span class="products-count"><strong>${total}</strong> products in ${catLabel}${search?' for "'+search+'"':''}</span>
        <div style="display:flex;align-items:center;gap:12px">
          <select class="sort-select" onchange="sortProductsFn(this.value)">
            <option value="default"${sort==='default'?' selected':''}>Relevance</option>
            <option value="rating"${sort==='rating'?' selected':''}>Top Rated</option>
            <option value="price_asc"${sort==='price_asc'?' selected':''}>Price: Low to High</option>
            <option value="price_desc"${sort==='price_desc'?' selected':''}>Price: High to Low</option>
            <option value="discount"${sort==='discount'?' selected':''}>Biggest Discount</option>
            <option value="new"${sort==='new'?' selected':''}>Newest First</option>
          </select>
          <div class="view-toggle"><button class="view-btn${currentView==='grid'?' active':''}" onclick="setViewFn('grid')" title="Grid">▦</button><button class="view-btn${currentView==='list'?' active':''}" onclick="setViewFn('list')" title="List">☰</button></div>
        </div>
      </div>
      <div class="${currentView==='list'?'products-list':'products-grid'}" id="products-grid">
        ${paginated.length>0?paginated.map(p=>currentView==='list'?renderProductCardList(p):renderProductCard(p)).join(''):`<div style="grid-column:1/-1" class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No Products Found</div><div class="empty-sub">Try adjusting filters</div><button class="btn btn-primary" onclick="clearFilters()">Clear Filters</button></div>`}
      </div>
      <div id="products-pagination">${pagination}</div>
    </main>
  </div></div>`;
}

    <nav class="breadcrumb"><a href="#/" onclick="event.preventDefault();navigate('#/')">Home</a> / <a href="#/products?cat=${product.category}" onclick="event.preventDefault();navigate('#/products?cat=${product.category}')">${CATEGORIES.find(c=>c.id===product.category)?.name||product.category}</a> / <span>${product.name.substring(0,35)}…</span></nav>

        <div class="detail-title">${product.name}</div>
        <div class="detail-rating"><span class="rating-pill">⭐ ${product.rating}</span><span style="font-size:13px;color:var(--text-secondary)">${fmt.number(product.reviews)} ratings</span><span class="badge badge-success">Bestseller</span></div>
        <div class="detail-price"><span class="current">${fmt.price(product.price)}</span><span class="mrp">${fmt.price(product.mrp)}</span><span class="off">${product.discount}% off</span><br/><span class="offer-tag">🏷️ Use code BACK2SCHOOL for extra 20% off</span></div>
        <div class="detail-availability"><span class="dot${product.stock>0?' dot-green':' dot-red'}"></span><span style="font-weight:600">${product.stock>0?'In Stock':'Out of Stock'}</span>${product.stock>0&&product.stock<5?`<span class="badge badge-warning">Only ${product.stock} left!</span>`:''}</div>
        <div class="quantity-selector"><label>Qty:</label><button class="qty-btn" onclick="changeQtyFn(-1)">−</button><input class="qty-input" type="number" value="1" min="1" max="10" id="qty-input" readonly /><button class="qty-btn" onclick="changeQtyFn(1)">+</button></div>
        <div class="detail-action-btns">
          <button class="btn btn-primary${inCart?' added':''}" id="detail-cart-btn" onclick="addToCartFromDetail(${product.id})"${product.stock===0?' disabled':''}>${inCart?'✓ Go to Cart':'🛒 Add to Cart'}</button>

function applyCouponFn(){
  const code=document.getElementById('coupon-input')?.value?.trim();
  if(!code){Toast.show('Please enter a coupon code','error');return;}
  const result=Cart.applyCoupon(code);
  const msg=document.getElementById('coupon-msg');
  if(result.ok){
    appliedCoupon=result;
    if(msg){msg.style.color='var(--success)';msg.textContent=`✅ Coupon applied! You save ${result.type==='percent'?result.rate+'%':'₹'+result.discount}.`;}
    const row=document.getElementById('coupon-discount-row');const val=document.getElementById('coupon-discount-val');
    if(row)row.style.display='flex';if(val)val.textContent='−'+fmt.price(result.discount);
    Toast.show(`Coupon ${code} applied! 🎉`,'success');
  }else{if(msg){msg.style.color='var(--danger)';msg.textContent='❌ '+result.error;}Toast.show(result.error,'error');}
}

async function placeOrderFn(){
  const name=document.getElementById('co-name')?.value?.trim();
  const mobile=document.getElementById('co-mobile')?.value?.trim();
  const address=document.getElementById('co-address')?.value?.trim();
  if(!name||!mobile||!address){Toast.show('Please fill in all required fields','error');return;}
  if(mobile.length!==10){Toast.show('Please enter a valid 10-digit mobile number','error');return;}
  const subtotal=Cart.getTotal(),shipping=subtotal>=499?0:49,gst=Math.round(subtotal*0.05);
  const total=subtotal+shipping+gst-(appliedCoupon?.discount||0);
  const order=await Orders.place({items:CartState.get().items,total:Math.max(total,0),address:{name,mobile,address},payment:document.querySelector('input[name="payment"]:checked')?.value||'cod',coupon:appliedCoupon?.code||null});
  appliedCoupon=null;
  navigate(`#/order-success?id=${order.id}`);
}

// Filter functions
function updateProductsGridOnly() {
  const grid = document.getElementById('products-grid');
  if (!grid) {
    renderProductsPage();
    return;
  }
  const { category, sort, search, maxPrice, rating, page } = productFilters;
  const PER_PAGE = 20;
  let products = [...PRODUCTS];
  if (category && category !== 'all') products = products.filter(p => p.category === category);
  if (search) products = Search.query(search, products);
  if (maxPrice < 2500) products = products.filter(p => p.price <= maxPrice);
  if (rating > 0) products = products.filter(p => p.rating >= rating);
  if (sort === 'price_asc')  products.sort((a, b) => a.price - b.price);
  if (sort === 'price_desc') products.sort((a, b) => b.price - a.price);
  if (sort === 'rating')     products.sort((a, b) => b.rating - a.rating);
  if (sort === 'discount')   products.sort((a, b) => b.discount - a.discount);
  if (sort === 'new')        products = products.slice().reverse();

  const total = products.length;
  const pages = Math.ceil(total / PER_PAGE);
  const curPage = page || 1;
  const paginated = products.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);

  grid.className = currentView === 'list' ? 'products-list' : 'products-grid';
  grid.innerHTML = paginated.length > 0
    ? paginated.map(p => currentView === 'list' ? renderProductCardList(p) : renderProductCard(p)).join('')
    : `<div style="grid-column:1/-1" class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No Products Found</div><div class="empty-sub">Try adjusting filters</div><button class="btn btn-primary" onclick="clearFilters()">Clear Filters</button></div>`;

  const countEl = document.querySelector('.products-count');
  if (countEl) {
    const catLabel = category && category !== 'all' ? CATEGORIES.find(c => c.id === category)?.name || category : 'All Products';
    countEl.innerHTML = `<strong>${total}</strong> products in ${catLabel}${search ? ' for "' + search + '"' : ''}`;
  }

  const paginationWrap = document.getElementById('products-pagination');
  if (paginationWrap) {
    paginationWrap.innerHTML = pages > 1
      ? `<div style="display:flex;justify-content:center;gap:8px;margin-top:32px;flex-wrap:wrap">${Array.from({length: pages}, (_, i) => `<button class="btn ${i + 1 === curPage ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="goToPage(${i + 1})">${i + 1}</button>`).join('')}</div>`
      : '';
  }
}

function filterByCategory(catId, checked) {
  productFilters.category = checked ? catId : 'all';
  productFilters.page = 1;
  updateProductsGridOnly();
}
function clearFilters() {
  productFilters = { category: 'all', sort: 'default', search: '', maxPrice: 2500, rating: 0, page: 1 };
  renderProductsPage();
}
function sortProductsFn(sort) {
  productFilters.sort = sort;
  updateProductsGridOnly();
}
function goToPage(page) {
  productFilters.page = page;
  updateProductsGridOnly();
  window.scrollTo({ top: 100, behavior: 'smooth' });
}
function filterByRating(r) {
  productFilters.rating = r;
  productFilters.page = 1;
  updateProductsGridOnly();
}
function updatePriceFilter(v) {
  productFilters.maxPrice = parseInt(v);
  productFilters.page = 1;
  const lbl = document.getElementById('price-label');
  if (lbl) lbl.textContent = '₹' + v;
  updateProductsGridOnly();
}
function setViewFn(view) {
  currentView = view;
  updateProductsGridOnly();
}

function handleImageFileUpload(input, previewId, inputId) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    const prev = document.getElementById(previewId);
    const inp = document.getElementById(inputId);
    if (prev) prev.src = dataUrl;
    if (inp) inp.value = dataUrl;
    Toast.show('Image loaded from device gallery! 🖼️', 'success');
  };
  reader.readAsDataURL(file);
}

function autoCalcDiscount() {
  const p = parseFloat(document.getElementById('ep-price')?.value || 0);
  const m = parseFloat(document.getElementById('ep-mrp')?.value || 0);
  if (m > 0 && p > 0) {
    const disc = Math.max(0, Math.round((1 - p / m) * 100));
    const discEl = document.getElementById('ep-discount');
    if (discEl) discEl.value = disc;
  }
}

function autoCalcPriceFromDiscount() {
  const d = parseFloat(document.getElementById('ep-discount')?.value || 0);
  const m = parseFloat(document.getElementById('ep-mrp')?.value || 0);
  if (m > 0 && d >= 0) {
    const p = Math.round(m * (1 - d / 100));
    const priceEl = document.getElementById('ep-price');
    if (priceEl) priceEl.value = p;
  }
}

async function saveEditProduct() {
  const id = parseInt(document.getElementById('ep-id')?.value);
  const name = document.getElementById('ep-name')?.value?.trim();
  const price = parseFloat(document.getElementById('ep-price')?.value);
  const mrp = parseFloat(document.getElementById('ep-mrp')?.value);
  const discount = parseInt(document.getElementById('ep-discount')?.value) || 0;
  const category = document.getElementById('ep-category')?.value || 'stationery';
  const brand = document.getElementById('ep-brand')?.value || 'Generic';
  const stock = parseInt(document.getElementById('ep-stock')?.value) || 0;
  const rating = parseFloat(document.getElementById('ep-rating')?.value) || 4.5;
  const image = document.getElementById('ep-image')?.value?.trim() || `https://picsum.photos/seed/${id}/400/400`;
  const description = document.getElementById('ep-description')?.value || '';

  if (!name || isNaN(price) || isNaN(mrp)) {
    Toast.show('Please fill in required fields (Title, Price, MRP)', 'error');
    return;
  }

  const updateData = { name, price, mrp, discount, category, brand, stock, rating, image, description };

  if (backendActive) {
    try {
      await apiRequest(`/products/${id}`, "PUT", updateData);
      Toast.show(`Product "${name}" updated in database! ✅`, 'success');
      document.getElementById('edit-product-modal').style.display = 'none';
      await loadProducts();
      routeRender(location.hash || '#/');
      return;
    } catch(e) {
      Toast.show("Backend update failed: " + e.message + ". Updating locally.", "warning");
    }
  }

  const idx = PRODUCTS.findIndex(p => p.id === id);
  if (idx !== -1) {
    PRODUCTS[idx] = { ...PRODUCTS[idx], ...updateData };
    window.PRODUCTS = PRODUCTS;
    const localProds = Storage.get('abd_custom_products', {});
    localProds[id] = PRODUCTS[idx];
    Storage.set('abd_custom_products', localProds);
  }

  document.getElementById('edit-product-modal').style.display = 'none';
  Toast.show(`Product "${name}" updated successfully! 🎉`, 'success');
  routeRender(location.hash || '#/');
}

async function saveProduct(){
  const name=document.getElementById('ap-name')?.value?.trim();
  const price=parseFloat(document.getElementById('ap-price')?.value);
  const mrp=parseFloat(document.getElementById('ap-mrp')?.value);
  if(!name||!price||!mrp){Toast.show('Please fill in required fields','error');return;}
  const prodData = {
    name,
    price,
    mrp,
    discount: Math.round((1-price/mrp)*100),
    category: document.getElementById('ap-category')?.value || 'stationery',
    brand: document.getElementById('ap-brand')?.value || 'Generic',
    stock: parseInt(document.getElementById('ap-stock')?.value) || 0,
    rating: parseFloat(document.getElementById('ap-rating')?.value) || 4.0,
    reviews: 0,
    description: document.getElementById('ap-description')?.value || '',
    image: `https://picsum.photos/seed/${Date.now()}/400/400`,
    tags: [document.getElementById('ap-category')?.value || 'stationery']
  };
  if (backendActive) {
    try {
      const res = await apiRequest("/products", "POST", prodData);
      if (res) {
        Toast.show(`Product "${name}" added to database! ✅`,'success');
        document.getElementById('add-product-modal').style.display='none';
        await loadProducts();
        routeRender(location.hash||'#/');
        return;
      }
    } catch(e) {
      Toast.show("Failed to save to database: " + e.message, "error");
    }
  }
  const newP={id:Date.now(),...prodData};
  PRODUCTS.unshift(newP);window.PRODUCTS=PRODUCTS;
  const localProds = Storage.get('abd_custom_products', {});
  localProds[newP.id] = newP;
  Storage.set('abd_custom_products', localProds);

  document.getElementById('add-product-modal').style.display='none';
  Toast.show(`Product "${name}" added locally! ✅`,'success');
  routeRender(location.hash||'#/');
}

async function delProduct(id){
  const p = PRODUCTS.find(prod => prod.id === id);
  const name = p ? p.name : `ID #${id}`;
  if(!confirm(`Are you sure you want to delete "${name}"?`))return;
  if (backendActive) {
    try {
      await apiRequest(`/products/${id}`, "DELETE");
      Toast.show(`Product "${name}" deleted from database!`, 'success');
      await loadProducts();
      routeRender(location.hash||'#/');
      return;
    } catch(e) {
      Toast.show("Failed to delete from database: " + e.message, "error");
    }
  }
  const idx=PRODUCTS.findIndex(p=>p.id===id);if(idx!==-1)PRODUCTS.splice(idx,1);
  const localProds = Storage.get('abd_custom_products', {});
  delete localProds[id];
  Storage.set('abd_custom_products', localProds);

  const row=document.getElementById(`admin-row-${id}`);if(row)row.remove();
  Toast.show(`Product "${name}" deleted`, 'info');
  routeRender(location.hash||'#/');
}

function setupSearch(){
  const input=document.getElementById('nav-search-input');
  const sugg=document.getElementById('search-suggestions');
  if(!input||!sugg)return;
  
  const handleInput=debounce(e=>{
    const q=e.target.value.trim();
    if(!q){sugg.style.display='none';return;}
    const results=Search.query(q,PRODUCTS).slice(0,8);
    if(!results.length){
      sugg.innerHTML=`<div class="search-suggestion-item" style="color:var(--text-muted)">No matching products</div>`;
      sugg.style.display='block';
      return;
    }
    sugg.innerHTML=results.map(p=>`<div class="search-suggestion-item" onclick="navigate('#/product/${p.id}');document.getElementById('search-suggestions').style.display='none'"><img class="s-img" src="${p.image}" alt="${p.name}" loading="lazy"/><div><div class="s-name">${p.name.substring(0,45)}</div><div class="s-price">${fmt.price(p.price)}</div></div></div>`).join('')+`<div class="search-suggestion-item" style="justify-content:center;color:var(--primary);font-weight:700" onclick="triggerGlobalSearch()">See all results for "${q}" →</div>`;
    sugg.style.display='block';
  },150);
  
  input.removeEventListener('input', handleInput);
  input.addEventListener('input',handleInput);
  document.addEventListener('click',e=>{if(!e.target.closest('.nav-search'))sugg.style.display='none';});
}

// Hero Banner
let heroIdx=0,heroTimer=null;
function heroSlide(dir){
  const slides=document.querySelectorAll('.hero-slide');if(!slides.length)return;
  slides[heroIdx].classList.remove('active');slides[heroIdx].classList.add('exit');
  setTimeout(()=>slides[heroIdx]?.classList.remove('exit'),600);
  heroIdx=(heroIdx+dir+slides.length)%slides.length;
  slides[heroIdx].classList.add('active');updateDots();
}
function goToSlide(i){
  const slides=document.querySelectorAll('.hero-slide');if(!slides.length)return;
  slides[heroIdx].classList.remove('active');heroIdx=i;slides[heroIdx].classList.add('active');updateDots();
}
function updateDots(){document.querySelectorAll('.hero-dot').forEach((d,i)=>d.classList.toggle('active',i===heroIdx));}
function startHero(){clearInterval(heroTimer);heroTimer=setInterval(()=>heroSlide(1),4500);}

async function loadAdminDataAndRender(sub) {
  if (backendActive) {
    try {
      app.innerHTML = `<div class="container" style="padding:100px 0;text-align:center"><div class="spinner" style="margin:0 auto"></div><p style="margin-top:16px;color:var(--text-secondary)">Loading secure Admin Panel data from database...</p></div>`;
      const stats = await apiRequest("/admin/stats");
      let ordersList = [];
      let customersList = [];
      if (sub === 'orders') {
        ordersList = await apiRequest("/admin/orders");
      } else if (sub === 'customers') {
        customersList = await apiRequest("/admin/customers");
      }
      
      const defaultStats = {...ADMIN_STATS, ...stats};
      app.innerHTML = renderAdmin(sub);
      
      const statContainer = document.querySelector('.admin-stats-grid');
      if (statContainer && stats) {
        statContainer.children[0].querySelector('.stat-val').textContent = fmt.price(stats.totalRevenue || 124500);
        statContainer.children[1].querySelector('.stat-val').textContent = stats.totalOrders || 48;
        statContainer.children[2].querySelector('.stat-val').textContent = stats.totalProducts || PRODUCTS.length;
        statContainer.children[3].querySelector('.stat-val').textContent = stats.totalCustomers || 156;
      }
      
      if (sub === 'orders' && ordersList.length > 0) {
        const tbody = document.querySelector('.data-table tbody');
        if (tbody) {
          tbody.innerHTML = ordersList.map(o => `<tr>
            <td><strong>#${o.id || o._id}</strong></td>
            <td>${o.customer_name || 'Customer'}</td>
            <td>${o.items?.length || 1} items</td>
            <td><strong>${fmt.price(o.total || 0)}</strong></td>
            <td>${fmt.date(o.placedAt)}</td>
            <td><div class="action-btns"><button class="btn-icon-sm btn-edit">👁️</button></div></td>
          </tr>`).join('');
        }
      } else if (sub === 'customers' && customersList.length > 0) {
        const tableBody = document.querySelector('.data-table tbody');
        if (tableBody) {
          tableBody.innerHTML = customersList.map(c => `<tr>
            <td><div style="display:flex;align-items:center;gap:8px"><div style="width:32px;height:32px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:700">${c.name[0]}</div><div><div style="font-weight:600;font-size:13px">${c.name}</div><div style="font-size:11px;color:var(--text-muted)">${c.email}</div></div></div></td>
            <td>${c.mobile}</td>
            <td><span class="badge badge-primary">Active</span></td>
            <td><strong>-</strong></td>
            <td style="color:var(--text-muted);font-size:13px">Joined</td>
            <td><div class="action-btns"><button class="btn-icon-sm btn-edit">👁️</button></div></td>
          </tr>`).join('');
        }
      }
      return;
    } catch(err) {
      console.error("Admin data loading error, falling back", err);
    }
  }
  app.innerHTML = renderAdmin(sub);
}

async function routeRender(hash){
  window.scrollTo(0,0);
  const route=hash.split('?')[0];
  const qs=new URLSearchParams(hash.includes('?')?hash.split('?')[1]:'');

  // Admin routes protection
  if(route.startsWith('#/admin')){
    if (!isAdminUser()) {
      setupNav();
      app.innerHTML = `<div class="container" style="padding:80px 0;text-align:center">
        <div style="font-size:64px;margin-bottom:16px">🔐</div>
        <h2 style="font-size:24px;font-weight:800;margin-bottom:8px">Admin Access Protected</h2>
        <p style="color:var(--text-secondary);margin-bottom:24px">Please enter the Owner Security PIN to access the Admin Panel.</p>
        <button class="btn btn-primary btn-lg" onclick="promptAdminPin(() => routeRender(location.hash))">🔑 Unlock Admin Mode</button>
      </div>`;
      promptAdminPin(() => routeRender(hash));
      return;
    }
    navContainer.innerHTML='';footerContainer.innerHTML='';
    const sub=route==='#/admin'||route==='#/admin/'?'dashboard':route.replace('#/admin/','');
    await loadAdminDataAndRender(sub);
    return;
  }

  renderPage();

  if(route==='#/'||route==='#'){
    await loadProducts();
    app.innerHTML=renderHome();
    heroIdx=0;
    startHero();
    return;
  }
  if(route==='#/login'){app.innerHTML=renderLogin();return;}
  if(route==='#/signup'){app.innerHTML=renderSignup();return;}
  if(route==='#/products'){
    productFilters.category=qs.get('cat')||'all';
    productFilters.sort=qs.get('sort')||'default';
    productFilters.search=qs.get('q')||'';
    productFilters.page=1;
    await loadProducts();
    app.innerHTML=renderProducts();
    return;
  }
  if(route.startsWith('#/product/')){
    const id=route.replace('#/product/','');
    await loadProducts();
    app.innerHTML=renderProductDetail(id);
    return;
  }
  if(route==='#/cart'){app.innerHTML=renderCart();return;}
  if(route==='#/checkout'){app.innerHTML=renderCheckout();return;}
  if(route==='#/order-success'){app.innerHTML=renderOrderSuccess(qs.get('id'));return;}
  if(route==='#/profile'){
    app.innerHTML = `<div class="container" style="padding:100px 0;text-align:center"><div class="spinner" style="margin:0 auto"></div><p style="margin-top:16px;color:var(--text-secondary)">Loading Profile & Orders...</p></div>`;
    const userOrders = await Orders.getAll();
    app.innerHTML=renderProfile();
    const orderContent = document.getElementById('profile-content');
    if (orderContent) {
      orderContent.innerHTML = renderOrdersTab(userOrders);
    }
    return;
  }
  if(route==='#/wishlist'){app.innerHTML=renderWishlist();return;}
  if(route==='#/search'){app.innerHTML=renderSearch(qs.get('q')||'');return;}
  if(route==='#/offers'){app.innerHTML=renderOffers();return;}
  if(route==='#/contact'){app.innerHTML=renderContact();return;}
  // Default
  await loadProducts();
  app.innerHTML=renderHome();
  heroIdx=0;
  startHero();
}
